    <script>
      // 1rem = 10 design px; the 1860px-wide Figma sections fill the full screen width (desktop only; tablet/mobile use CSS values)
      (function () {
        function fit() {
          var w = document.documentElement.clientWidth;
          document.documentElement.style.fontSize = w >= 1280 ? w / 186 + 'px' : '';
        }
        fit();
        window.addEventListener('resize', fit);
      })();
